name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write # save/restore the type=gha docker build cache

jobs:
  package:
    name: ${{ matrix.distro }} (${{ matrix.format }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            dockerfile: Dockerfile.fedora
            format: rpm
            rpm_requires: kf6-kirigami, kf6-kcmutils, kf6-knewstuff
          - distro: opensuse
            dockerfile: Dockerfile.opensuse
            format: rpm
            rpm_requires: kf6-kirigami, kf6-kcmutils, kf6-knewstuff
          - distro: mageia
            dockerfile: Dockerfile.mageia
            format: rpm
            rpm_requires: lib64kirigami6, lib64kf6kcmutils6, lib64kf6newstuffcore6
          #! The libplasma soname changed from 6 to 7 between Plasma 6.5
          #! and 6.6, so a single deb cannot cover both camps: the trixie
          #! build (libplasma6) serves Debian 13 stable, the testing build
          #! (libplasma7) serves Debian testing and Ubuntu 26.04+.
          - distro: debian
            dockerfile: Dockerfile.debian
            format: deb
          - distro: debian-testing
            dockerfile: Dockerfile.debian-testing
            format: deb
          - distro: arch
            dockerfile: Dockerfile.arch
            format: pkg.tar.zst

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.distro }})
        uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/${{ matrix.dockerfile }}
          build-args: USE_MIRRORS=false
          tags: latte-build-${{ matrix.distro }}
          load: true
          provenance: false
          # Cache the dependency-install layers between runs, scoped per
          # distro so the matrix entries do not evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}

      - name: Build and package (${{ matrix.distro }})
        run: |
          mkdir -p dist
          docker run --rm \
            -v ${{ github.workspace }}:/src:ro \
            -v ${{ github.workspace }}/dist:/out \
            -e VERSION="${{ env.VERSION }}" \
            --tmpfs /build:exec \
            -w /build \
            latte-build-${{ matrix.distro }} \
            bash -c "
              set -e
              if [ '${{ matrix.format }}' = 'pkg.tar.zst' ]; then
                bash /src/docker/package-arch.sh \"\$VERSION\" /out
              else
                GEN=\$([ '${{ matrix.format }}' = 'rpm' ] && echo RPM || echo DEB)
                #! The trixie build carries the Debian 13 revision marker
                #! (+deb13u1, the Debian convention for stable-specific
                #! rebuilds) in the package version, which flows into both
                #! the control file and the file name; testing keeps
                #! the plain -1 release.
                DEBREL='1'
                if [ '${{ matrix.distro }}' = 'debian' ]; then DEBREL='1+deb13u1'; fi
                cmake /src -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DVERSION=\"\$VERSION\" -DCPACK_DEBIAN_PACKAGE_RELEASE=\"\$DEBREL\" -DLATTE_RPM_PACKAGE_REQUIRES=${{ matrix.rpm_requires }}
                cmake --build . --parallel \$(nproc)
                #! source-install verification on this distro: the install
                #! must land the binary and the desktop file
                cmake --install .
                test -x /usr/bin/latte-dock-ng
                test -f /usr/share/applications/org.kde.latte-dock.desktop
                echo SOURCE_INSTALL_OK
                cpack -G \"\$GEN\"
                #! The +deb13u1 revision already distinguishes the two deb
                #! variants, so plain copying keeps the names apart.
                if [ '${{ matrix.format }}' = 'deb' ]; then
                  cp /build/latte-dock-ng_*.deb /out/
                else
                  cp /build/latte-dock-ng*.* /out/
                fi
              fi
            "

      - name: Smoke test RPM
        if: matrix.format == 'rpm'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/dist:/out:ro \
            latte-build-${{ matrix.distro }} \
            bash -c "
              set -e
              rpm_path=\$(ls /out/latte-dock-ng-*.rpm | head -1)
              echo '== Native QML package dependencies =='
              rpm -qpR \"\$rpm_path\" | grep -E 'kf6-(kirigami|kcmutils|knewstuff)|lib64(kirigami6|kf6kcmutils6|kf6newstuffcore6)'
              echo '== File list sanity =='
              rpm -qpl \"\$rpm_path\" | grep -E '/bin/latte-dock-ng\$|/share/applications/org.kde.latte-dock.desktop\$|/qt6/qml/org/kde/latte/core/qmldir\$|/share/icons/hicolor/'
              echo '== Install (unresolvable Requires fails here) =='
              if command -v dnf >/dev/null; then
                dnf install -y --setopt=install_weak_deps=False \"\$rpm_path\"
              else
                zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm \"\$rpm_path\"
              fi
              echo '== rpmlint (errors are fatal, warnings informational) =='
              if command -v rpmlint >/dev/null; then
                LC_ALL=C rpmlint \"\$rpm_path\" | tee /tmp/rpmlint.log
                ! grep -q 'E: ' /tmp/rpmlint.log
              else
                echo 'rpmlint not available on this distro; skipping'
              fi
              echo '== Launch (headless) =='
              set +e
              start=\$(date +%s)
              out=\$(QT_QPA_PLATFORM=offscreen timeout 30 latte-dock-ng 2>&1)
              rc=\$?
              elapsed=\$(( \$(date +%s) - start ))
              set -e
              echo \"\$out\" | tail -3
              echo \"exit code: \$rc, elapsed: \${elapsed}s\"
              # The Wayland-only build must reach the platform gate: exit 1
              # after its 10x500ms retry loop. Anything else (127 missing lib,
              # 124 hang, 139 crash, or a fast exit) means the package is broken.
              [ \$rc -eq 1 ] || { echo 'unexpected exit code'; exit 1; }
              [ \$elapsed -ge 4 ] || { echo 'exited before the platform retry loop completed'; exit 1; }
            "

      - name: Smoke test DEB
        if: matrix.format == 'deb'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/dist:/out:ro \
            latte-build-${{ matrix.distro }} \
            bash -c "
              set -e
              deb_path=\$(ls /out/latte-dock-ng_*.deb | head -1)
              echo '== Versioned deps (must match the libplasma camp of this distro) =='
              dpkg-deb -f \"\$deb_path\" Depends | grep -E 'libplasma6|libplasma7|libqt6core|libc6'
              echo '== Install (apt resolves Depends from the distro repos) =='
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \"\$deb_path\"
              echo '== Launch (headless) =='
              set +e
              start=\$(date +%s)
              out=\$(QT_QPA_PLATFORM=offscreen timeout 30 latte-dock-ng 2>&1)
              rc=\$?
              elapsed=\$(( \$(date +%s) - start ))
              set -e
              echo \"\$out\" | tail -3
              echo \"exit code: \$rc, elapsed: \${elapsed}s\"
              # The Wayland-only build must reach the platform gate: exit 1
              # after its 10x500ms retry loop. Anything else means a broken
              # package (missing lib, hang, crash, or fast exit).
              [ \$rc -eq 1 ] || { echo 'unexpected exit code'; exit 1; }
              [ \$elapsed -ge 4 ] || { echo 'exited before the platform retry loop completed'; exit 1; }
            "

      - name: Smoke test Arch
        if: matrix.format == 'pkg.tar.zst'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/dist:/out:ro \
            latte-build-${{ matrix.distro }} \
            bash -c "
              set -e
              pkg_path=\$(ls /out/latte-dock-ng-*.pkg.tar.zst | head -1)
              echo '== Install (pacman resolves deps from the repo) =='
              pacman -U --noconfirm \"\$pkg_path\"
              echo '== Launch (headless) =='
              set +e
              start=\$(date +%s)
              out=\$(QT_QPA_PLATFORM=offscreen timeout 30 latte-dock-ng 2>&1)
              rc=\$?
              elapsed=\$(( \$(date +%s) - start ))
              set -e
              echo \"\$out\" | tail -3
              echo \"exit code: \$rc, elapsed: \${elapsed}s\"
              [ \$rc -eq 1 ] || { echo 'unexpected exit code'; exit 1; }
              [ \$elapsed -ge 4 ] || { echo 'exited before the platform retry loop completed'; exit 1; }
            "

      - name: Disambiguate RPM artifact filename
        if: matrix.format == 'rpm'
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          for package in dist/*.rpm; do
            mv "$package" "${package%.rpm}-${DISTRO}.rpm"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.distro }}
          path: dist/

  nixos:
    name: NixOS (flake)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build NixOS package
        run: nix build .#default --no-link --print-build-logs

  release:
    name: Create Release
    needs: [package, nixos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: List packages
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  apt-repository:
    name: Publish signed APT repository
    needs: [package, nixos, release]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    concurrency:
      group: latte-dock-ng-apt-repository
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check APT signing secrets
        id: signing
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          if [ -n "$APT_SIGNING_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "APT publication skipped: APT_SIGNING_PRIVATE_KEY is not configured."
          fi

      - name: Download Debian packages
        if: steps.signing.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: package-debian*
          merge-multiple: true
          path: ${{ runner.temp }}/apt-debs

      - name: Install repository tools
        if: steps.signing.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Publish Debian and Ubuntu APT suites
        if: steps.signing.outputs.configured == 'true'
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_DEB_DIR: ${{ runner.temp }}/apt-debs
        run: |
          bash scripts/publish-apt-repository.sh

      - name: Collect GitHub Pages content
        if: steps.signing.outputs.configured == 'true'
        run: |
          git switch gh-pages
          mkdir -p "$RUNNER_TEMP/pages"
          cp -a dists pool latte-dock-ng-archive-keyring.gpg "$RUNNER_TEMP/pages/"

      - name: Upload GitHub Pages artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy GitHub Pages
        if: steps.signing.outputs.configured == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
