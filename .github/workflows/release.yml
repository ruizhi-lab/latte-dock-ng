name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Validated release tag
        required: true
        type: string
      source_sha:
        description: Source commit validated by Build
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  main-validation:
    name: Require successful main pre-release gate
    runs-on: ubuntu-24.04
    outputs:
      build_run_id: ${{ steps.validation.outputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Require tag version to match the validated source version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          actual=$(sed -n 's/^ *set(VERSION \([^)]*\)).*/\1/p' CMakeLists.txt | head -1)
          test -n "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Tag version $expected does not match CMakeLists.txt version $actual." >&2
            exit 1
          fi

      - name: Find the successful Build run for this commit
        id: validation
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build.yml",
              branch: "main",
              event: "push",
              head_sha: process.env.SOURCE_SHA,
              per_page: 100,
            });
            const passed = data.workflow_runs.find((run) =>
              run.status === "completed" && run.conclusion === "success"
            );
            if (!passed) {
              core.setFailed(`Commit ${process.env.SOURCE_SHA} has no successful Build run from main.`);
              return;
            }
            core.setOutput("build_run_id", passed.id);
            core.info(`Validated by Build run ${passed.id}: ${passed.html_url}`);

  apt-repository:
    name: Publish signed APT repository
    needs: [main-validation, gentoo-overlay-validate]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    concurrency:
      group: latte-dock-ng-apt-repository
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check APT signing secrets
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_SIGNING_PRIVATE_KEY" ]; then
            echo "APT publication cannot run: APT_SIGNING_PRIVATE_KEY is not configured." >&2
            exit 1
          fi

      - name: Download preflight-validated packages
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.main-validation.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: release-package-*
          merge-multiple: true
          path: ${{ runner.temp }}/apt-debs

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Publish Debian and Ubuntu APT suites
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_DEB_DIR: ${{ runner.temp }}/apt-debs
        run: bash scripts/publish-apt-repository.sh

      - name: Collect GitHub Pages content
        run: |
          git switch gh-pages
          mkdir -p "$RUNNER_TEMP/pages"
          cp -a dists pool latte-dock-ng-archive-keyring.gpg "$RUNNER_TEMP/pages/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  gentoo-overlay-validate:
    name: Validate Gentoo overlay ebuild
    needs: [main-validation]
    runs-on: ubuntu-24.04
    outputs:
      overlay_sha: ${{ steps.overlay_ref.outputs.sha }}
    steps:
      - name: Check overlay write token is configured
        env:
          RUIZHI_OVERLAY_TOKEN: ${{ secrets.RUIZHI_OVERLAY_TOKEN }}
        run: |
          if [ -z "$RUIZHI_OVERLAY_TOKEN" ]; then
            echo "Overlay publication cannot run: RUIZHI_OVERLAY_TOKEN is not configured." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out Gentoo overlay
        uses: actions/checkout@v4
        with:
          repository: ruizhi-lab/gentoo-overlay
          ref: main
          path: gentoo-overlay

      - name: Record validated overlay revision
        id: overlay_ref
        run: echo "sha=$(git -C gentoo-overlay rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build current Gentoo package toolchain
        run: |
          docker build --pull --no-cache --file docker/Dockerfile.gentoo \
            --build-arg USE_MIRRORS=false \
            --tag latte-gentoo-release docker

      - name: Prepare and validate the tagged ebuild and Manifest
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p "$RUNNER_TEMP/gentoo-distfiles"
          docker run --rm --network host \
            --volume "${{ github.workspace }}:/src:ro" \
            --volume "${{ github.workspace }}/gentoo-overlay:/overlay" \
            --volume "$RUNNER_TEMP/gentoo-distfiles:/distfiles" \
            --tmpfs /tmp:exec \
            --env DISTDIR=/distfiles \
            latte-gentoo-release \
            bash /src/scripts/prepare-gentoo-overlay.sh "$version" /overlay

      - name: Retain validated ebuild and Manifest
        uses: actions/upload-artifact@v4
        with:
          name: gentoo-overlay-package
          path: gentoo-overlay/kde-misc/latte-dock-ng/
          if-no-files-found: error
          retention-days: 90

  gentoo-overlay-publish:
    name: Publish Gentoo overlay ebuild
    needs: [apt-repository, gentoo-overlay-validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Check overlay write token
        env:
          RUIZHI_OVERLAY_TOKEN: ${{ secrets.RUIZHI_OVERLAY_TOKEN }}
        run: |
          if [ -z "$RUIZHI_OVERLAY_TOKEN" ]; then
            echo "Overlay publication cannot run: RUIZHI_OVERLAY_TOKEN is not configured." >&2
            exit 1
          fi

      - name: Check out Gentoo overlay
        uses: actions/checkout@v4
        with:
          repository: ruizhi-lab/gentoo-overlay
          ref: main
          path: gentoo-overlay
          token: ${{ secrets.RUIZHI_OVERLAY_TOKEN }}

      - name: Require the overlay to match the validated revision
        env:
          VALIDATED_OVERLAY_SHA: ${{ needs.gentoo-overlay-validate.outputs.overlay_sha }}
        run: |
          current_sha=$(git -C gentoo-overlay rev-parse HEAD)
          if [ "$current_sha" != "$VALIDATED_OVERLAY_SHA" ]; then
            echo "Gentoo overlay main advanced after ebuild validation; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Remove obsolete versioned ebuilds and preserve the live ebuild
        run: |
          package_dir=gentoo-overlay/kde-misc/latte-dock-ng
          test -f "$package_dir/latte-dock-ng-9999.ebuild"
          sha256sum "$package_dir/latte-dock-ng-9999.ebuild" > "$RUNNER_TEMP/9999.before"
          find "$package_dir" -maxdepth 1 -type f -name 'latte-dock-ng-*.ebuild' \
            ! -name 'latte-dock-ng-9999.ebuild' -delete

      - name: Download validated ebuild and Manifest
        uses: actions/download-artifact@v4
        with:
          name: gentoo-overlay-package
          path: gentoo-overlay/kde-misc/latte-dock-ng

      - name: Verify live ebuild is preserved
        run: |
          package_dir=gentoo-overlay/kde-misc/latte-dock-ng
          test -f "$package_dir/latte-dock-ng-9999.ebuild"
          sha256sum --check "$RUNNER_TEMP/9999.before"

      - name: Commit and push the overlay update
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git -C gentoo-overlay config user.name "github-actions[bot]"
          git -C gentoo-overlay config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gentoo-overlay add -- kde-misc/latte-dock-ng
          if git -C gentoo-overlay diff --cached --quiet; then
            echo "The overlay already contains the validated $RELEASE_VERSION recipe."
            exit 0
          fi
          git -C gentoo-overlay commit -m "kde-misc/latte-dock-ng: add ${RELEASE_VERSION#v}"
          git -C gentoo-overlay push origin main

  release:
    name: Create Release from validated packages
    needs: [main-validation, apt-repository, gentoo-overlay-publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download packages from the successful pre-release gate
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.main-validation.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: release-package-*
          merge-multiple: true
          path: dist

      - name: Verify release asset set
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 7
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
