name: Build
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release candidate v{0}', inputs.release_version) || format('Build {0}', github.sha) }}
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (X.Y.Z, without v); publish automatically after all checks pass
        required: true
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-input:
    name: Resolve and validate candidate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        env:
          LATTE_RELEASE_VERSION: ${{ inputs.release_version }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$SOURCE_REF" != refs/heads/main ]; then
            echo "Release candidates must be dispatched from main." >&2
            exit 1
          fi
          version=$(python3 scripts/release-version.py resolve)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [release-input]
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            preset: gcc-debug
            build_type: Debug
            cc: gcc
            cxx: g++
          - name: GCC Release
            preset: gcc-release
            build_type: Release
            cc: gcc
            cxx: g++
          - name: Clang Debug
            preset: clang-debug
            build_type: Debug
            cc: clang
            cxx: clang++
          - name: Clang Release
            preset: clang-release
            build_type: Release
            cc: clang
            cxx: clang++
    env:
      LATTE_RELEASE_VERSION: ${{ needs.release-input.outputs.version }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Install KDE Neon repository
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates wget gnupg
          wget -qO /etc/apt/trusted.gpg.d/neon.asc https://archive.neon.kde.org/public.key
          echo "deb https://archive.neon.kde.org/user noble main" > /etc/apt/sources.list.d/neon.list
          apt-get update

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential clang clang-tidy cmake extra-cmake-modules pkgconf dbus-daemon git python3 \
            qt6-base-dev qt6-declarative-dev qt6-declarative-private-dev qt6-wayland-dev qt6-tools-dev \
            libkf6archive-dev libkf6config-dev libkf6coreaddons-dev \
            libkf6crash-dev libkf6dbusaddons-dev libkf6declarative-dev \
            libkf6globalaccel-dev libkf6guiaddons-dev libkf6i18n-dev \
            libkf6iconthemes-dev libkf6kio-dev libkf6itemmodels-dev \
            libkf6newstuff-dev libkf6notifications-dev libkf6package-dev \
            libkf6windowsystem-dev libkf6xmlgui-dev kf6-ksvg-dev \
            libplasma-dev libkpipewire-dev libkf6wayland-dev \
            plasma-activities-dev plasma-activities-stats-dev \
            plasma-workspace-dev plasma-pa plasma-wayland-protocols breeze-icon-theme libqt6svg6 \
            libwayland-dev liblayershellqtinterface-dev

      - uses: actions/checkout@v4

      - name: Record toolchain versions
        run: |
          cmake --version
          "$CC" --version
          "$CXX" --version

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/modernization/logs
          cmake --preset "${{ matrix.preset }}" -DVERSION="$LATTE_RELEASE_VERSION" 2>&1 | tee "build/modernization/logs/${{ matrix.preset }}-configure.log"

      # The build preset includes both the default application/plugin targets
      # and latte-autotests, and fixes the build parallelism at eight jobs.
      - name: Build application and autotests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset "${{ matrix.preset }}" 2>&1 | tee "build/modernization/logs/${{ matrix.preset }}-build.log"

      - name: Run targeted clang-tidy checks
        if: matrix.preset == 'clang-debug'
        run: python3 scripts/test-clang-tidy.py --build-dir "build/modernization/${{ matrix.preset }}"

      - name: Verify strict warnings reject and clear a diagnostic
        run: python3 scripts/test-strict-warnings.py --compiler "$CXX" --build-type "${{ matrix.build_type }}"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          ctest --preset "${{ matrix.preset }}" 2>&1 | tee "build/modernization/logs/${{ matrix.preset }}-ctest.log"

      - name: Configure targeted ASan/UBSan tree
        if: matrix.preset == 'gcc-debug'
        run: cmake --preset gcc-asan-ubsan -DVERSION="$LATTE_RELEASE_VERSION"

      - name: Build targeted ASan/UBSan tests
        if: matrix.preset == 'gcc-debug'
        run: cmake --build --preset gcc-asan-ubsan

      - name: Run targeted ASan/UBSan tests
        if: matrix.preset == 'gcc-debug'
        run: ctest --preset gcc-asan-ubsan

      - name: Verify sanitizer fixtures report both defect classes
        if: matrix.preset == 'gcc-debug'
        run: python3 scripts/test-sanitizers.py --compiler "$CXX"

      # Type-resolution lint over the freshly built modules: fails on QML
      # errors and on broken/missing generated latte QML modules. Legacy
      # warnings are summarized into the preset build's qmllint-deep.log.
      # Checkout ownership differs inside the job container, so trust only
      # this workspace before the script uses git ls-files for QML discovery.
      - name: Trust workspace for Git file discovery
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Deep QML lint
        run: ./scripts/qmllint-deep.sh "build/modernization/${{ matrix.preset }}"

      - name: Retain QML baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmllint-baseline-${{ matrix.preset }}
          path: |
            build/modernization/${{ matrix.preset }}/qmllint-deep.log
            build/modernization/${{ matrix.preset }}/qmllint-baseline/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-${{ matrix.preset }}
          path: |
            build/modernization/logs/${{ matrix.preset }}-*.log
            build/modernization/${{ matrix.preset }}/CMakeCache.txt
            build/modernization/${{ matrix.preset }}/compile_commands.json
            build/modernization/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/modernization/${{ matrix.preset }}/qmllint-deep.log
          if-no-files-found: warn
          retention-days: 7

  qml-lint:
    needs: [release-input]
    env:
      LATTE_RELEASE_VERSION: ${{ needs.release-input.outputs.version }}
    name: QML lint (qmllint)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install qmllint
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 qt6-declarative-dev qt6-declarative-dev-tools

      - uses: actions/checkout@v4

      # Syntax-error gate over every tracked QML file (scripts/qmllint.sh
      # disables all analyzer warnings; only errors fail the run).
      - name: Lint QML sources
        run: ./scripts/qmllint.sh

  install-verify:
    needs: [release-input]
    env:
      LATTE_RELEASE_VERSION: ${{ needs.release-input.outputs.version }}
    name: Install verify (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            dockerfile: Dockerfile.arch
            verifier: verify-install.sh
          - distro: fedora
            dockerfile: Dockerfile.fedora
            verifier: verify-install.sh
          - distro: opensuse
            dockerfile: Dockerfile.opensuse
            verifier: verify-install.sh
          - distro: ubuntu
            dockerfile: Dockerfile.ubuntu
            verifier: verify-install.sh
          - distro: mageia
            dockerfile: Dockerfile.mageia
            verifier: verify-install.sh
          - distro: debian13
            dockerfile: Dockerfile.debian
            verifier: verify-install.sh
            build_args: DEBIAN_BASE=trixie
          - distro: debian-testing
            dockerfile: Dockerfile.debian-testing
            verifier: verify-install.sh
          - distro: nixos
            dockerfile: Dockerfile.nixos
            verifier: verify-nix-nixos.sh

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.distro }} verification image
        run: |
          build_args=()
          if [ -n "${{ matrix.build_args }}" ]; then
            build_args+=(--build-arg "${{ matrix.build_args }}")
          fi
          docker build --pull --no-cache --file docker/${{ matrix.dockerfile }} \
            --build-arg USE_MIRRORS=false \
            "${build_args[@]}" \
            --tag latte-verify-${{ matrix.distro }} docker

      - name: Verify build and installation
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/src:ro" \
            --tmpfs /build:exec \
            --workdir /build \
            --env LATTE_RELEASE_VERSION="$LATTE_RELEASE_VERSION" \
            latte-verify-${{ matrix.distro }} \
            bash /src/docker/${{ matrix.verifier }} "${{ matrix.distro }}"

  package-install-verify:
    needs: [release-input]
    env:
      LATTE_RELEASE_VERSION: ${{ needs.release-input.outputs.version }}
    name: Package install verify (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            dockerfile: Dockerfile.arch
            format: arch
          - distro: fedora
            dockerfile: Dockerfile.fedora
            format: rpm
            rpm_requires: kf6-kirigami, kf6-kcmutils, kf6-knewstuff
          - distro: opensuse
            dockerfile: Dockerfile.opensuse
            format: rpm
            rpm_requires: kf6-kirigami, kf6-kcmutils, kf6-knewstuff
          - distro: mageia
            dockerfile: Dockerfile.mageia
            format: rpm
            rpm_requires: lib64kirigami6, lib64kf6kcmutils6, lib64kf6newstuffcore6
          - distro: debian13
            dockerfile: Dockerfile.debian
            build_args: DEBIAN_BASE=trixie
            format: deb
            debian_release: 1+deb13u1
          - distro: debian-testing
            dockerfile: Dockerfile.debian-testing
            format: deb
            debian_release: 1
          - distro: ubuntu
            dockerfile: Dockerfile.ubuntu
            format: deb
            debian_release: 1ubuntu1

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.distro }} packaging image
        run: |
          build_args=()
          if [ -n "${{ matrix.build_args }}" ]; then
            build_args+=(--build-arg "${{ matrix.build_args }}")
          fi
          docker build --pull --no-cache --file docker/${{ matrix.dockerfile }} \
            --build-arg USE_MIRRORS=false \
            "${build_args[@]}" \
            --tag latte-package-${{ matrix.distro }} docker

      - name: Build and install native package
        run: |
          mkdir -p "dist/${{ matrix.distro }}"
          docker run --rm \
            --volume "${{ github.workspace }}:/src:ro" \
            --volume "${{ github.workspace }}/dist/${{ matrix.distro }}:/out" \
            --tmpfs /build:exec \
            --workdir /build \
            --env LATTE_RELEASE_VERSION="$LATTE_RELEASE_VERSION" \
            --env DISTRO="${{ matrix.distro }}" \
            latte-package-${{ matrix.distro }} \
            bash -c '
              set -euo pipefail
              VERSION="$LATTE_RELEASE_VERSION"
              if [ "${{ matrix.format }}" = arch ]; then
                bash /src/docker/package-arch.sh "$VERSION" /out
                pacman -U --noconfirm /out/latte-dock-ng-*.pkg.tar.zst
                test "$(pacman -Q latte-dock-ng | cut -d" " -f2)" = "$VERSION-1"
              elif [ "${{ matrix.format }}" = rpm ]; then
                cmake /src -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DVERSION="$VERSION" \
                  -DLATTE_RPM_PACKAGE_REQUIRES=${{ matrix.rpm_requires }}
                cmake --build . --parallel "$(nproc)"
                cpack -G RPM
                for package in ./latte-dock-ng-*.rpm; do
                  test "$(rpm -qp --qf "%{VERSION}" "$package")" = "$VERSION"
                done
                if command -v dnf >/dev/null; then
                  dnf install -y --setopt=install_weak_deps=False ./latte-dock-ng-*.rpm
                else
                  zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm ./latte-dock-ng-*.rpm
                fi
                test "$(rpm -q --qf "%{VERSION}" latte-dock-ng)" = "$VERSION"
                for package in ./latte-dock-ng-*.rpm; do
                  cp "$package" "/out/${package%.rpm}-${DISTRO}.rpm"
                done
              else
                package_args=()
                if [ -n "${{ matrix.debian_release }}" ]; then
                  package_args+=("-DCPACK_DEBIAN_PACKAGE_RELEASE=${{ matrix.debian_release }}")
                fi
                cmake /src -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DVERSION="$VERSION" "${package_args[@]}"
                cmake --build . --parallel "$(nproc)"
                cpack -G DEB
                for package in ./latte-dock-ng_*.deb; do
                  test "$(dpkg-deb --field "$package" Version | cut -d- -f1)" = "$VERSION"
                done
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./latte-dock-ng_*.deb
                test "$(dpkg-query --show latte-dock-ng | cut -f2 | cut -d- -f1)" = "$VERSION"
                cp ./latte-dock-ng_*.deb /out/
              fi
              test -x /usr/bin/latte-dock-ng
              test -f /usr/share/applications/org.kde.latte-dock.desktop
              echo "NATIVE_PACKAGE_INSTALL_OK: $VERSION installed"
            '

      - name: Retain validated release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.distro }}
          path: dist/${{ matrix.distro }}/*
          if-no-files-found: error
          retention-days: 90

  nixos-release-check:
    needs: [release-input]
    env:
      LATTE_RELEASE_VERSION: ${{ needs.release-input.outputs.version }}
    name: NixOS release check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check --impure --print-build-logs

      - name: Check Nix and CMake release versions match
        run: |
          cmake_version=$(sed -n 's/^ *set(VERSION \([^)]*\)).*/\1/p' CMakeLists.txt | head -1)
          nix_version=$(sed -n 's/^ *version = "\([^"]*\)";.*/\1/p' default.nix | head -1)
          test -n "$cmake_version"
          test "$cmake_version" = "$nix_version"

      - name: Build NixOS package
        run: |
          test "$(nix eval .#default.version --impure --raw)" = "$LATTE_RELEASE_VERSION"
          nix build .#default --impure --no-link --print-build-logs

  gentoo-ebuild-preflight:
    needs: [release-input]
    env:
      LATTE_RELEASE_VERSION: ${{ needs.release-input.outputs.version }}
    name: Gentoo ebuild preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Require overlay publication token on main
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          RUIZHI_OVERLAY_TOKEN: ${{ secrets.RUIZHI_OVERLAY_TOKEN }}
        run: |
          if [ -z "$RUIZHI_OVERLAY_TOKEN" ]; then
            echo "Set the RUIZHI_OVERLAY_TOKEN Actions secret before release validation." >&2
            exit 1
          fi

      - name: Check out the current Gentoo package template
        uses: actions/checkout@v4
        with:
          repository: ruizhi-lab/gentoo-overlay
          ref: main
          path: gentoo-overlay-source
          token: ${{ secrets.RUIZHI_OVERLAY_TOKEN }}

      - name: Build current Gentoo toolchain image
        run: |
          docker build --pull --no-cache --file docker/Dockerfile.gentoo \
            --build-arg USE_MIRRORS=false \
            --tag latte-gentoo-preflight docker

      - name: Build candidate ebuild from the current source tree
        run: |
          version="$LATTE_RELEASE_VERSION"
          template=$(find gentoo-overlay-source/kde-misc/latte-dock-ng -maxdepth 1 \
            -type f -name 'latte-dock-ng-*.ebuild' ! -name 'latte-dock-ng-9999.ebuild' \
            -print | sort -V | tail -1)
          test -n "$template"
          docker run --rm --network host \
            --volume "${{ github.workspace }}:/src:ro" \
            --volume "${{ github.workspace }}/$template:/overlay-ebuild:ro" \
            --volume "${{ github.workspace }}/gentoo-overlay-source/kde-misc/latte-dock-ng:/overlay-package:ro" \
            --tmpfs /tmp:exec \
            --env VERSION="$version" \
            --env GENTOO_VERIFY_FETCH_TAG=false \
            --env GENTOO_EBUILD_TEMPLATE=/overlay-ebuild \
            --env GENTOO_METADATA_TEMPLATE=/overlay-package/metadata.xml \
            latte-gentoo-preflight \
            bash /src/docker/verify-ebuild-gentoo.sh

  apt-repository-preflight:
    name: APT repository preflight (no publish)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [release-input, package-install-verify, nixos-release-check, gentoo-ebuild-preflight]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download validated Debian and Ubuntu packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          merge-multiple: true
          path: ${{ runner.temp }}/apt-debs

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Build and verify signed APT repository without publishing
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_DEB_DIR: ${{ runner.temp }}/apt-debs
        run: bash scripts/publish-apt-repository.sh --dry-run "${RUNNER_TEMP}/apt-preview"

  release-candidate-metadata:
    name: Bind validated packages to version and source
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [release-input, build, qml-lint, install-verify, package-install-verify, nixos-release-check, gentoo-ebuild-preflight, apt-repository-preflight]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          merge-multiple: true
          path: dist
      - name: Record candidate identity and package checksums
        env:
          LATTE_RELEASE_VERSION: ${{ needs.release-input.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/release-version.py metadata --sha "$SOURCE_SHA" \
            --run-id "$BUILD_RUN_ID" --packages dist --file release-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-metadata
          path: release-candidate.json
          if-no-files-found: error
          retention-days: 90
